spring.application.name=student-attendance-system
server.port=8080

# ---- MySQL (change username/password to match your machine) ----
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- JWT (secret must be at least 32 characters) ----
app.jwt.secret=change-this-secret-to-a-long-random-string-before-deploying
app.jwt.expiration-ms=86400000

# ---- CORS (React dev server) ----
app.cors.allowed-origin=http://localhost:5173
